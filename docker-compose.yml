services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rastreador_assinaturas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreador_assinaturas"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      DB_HOST: banco
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: rastreador_assinaturas
      SERVER_ADDR: ":8080"
      TZ: America/Manaus
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres:
