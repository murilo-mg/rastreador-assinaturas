name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: rastreador_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rastreador_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/rastreador_teste?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - name: Conferir formatação
        run: test -z "$(gofmt -l .)"
      - name: Analisar código
        run: go vet ./...
      - name: Executar testes e integração com PostgreSQL
        run: go test -race -count=1 ./...
      - name: Verificar build do Docker
        run: docker build -f dockerfile -t rastreador-teste .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Testar e gerar demonstração estática
        run: |
          node --test testes/*.test.mjs
          node scripts/gerar-demo.mjs
